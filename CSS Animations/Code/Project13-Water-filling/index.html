<!DOCTYPE html>
<html>
<head>
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
}

.water-container {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 4px solid #3498db;
    overflow: hidden;
    position: relative;
}

.water {
    position: absolute;
    bottom: -100%;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to top, #2980b9, #6dd5fa);
    animation: fillWater 4s infinite ease-in-out;
}

@keyframes fillWater {
    0% { bottom: -100%; }
    50% { bottom: 0; }
    100% { bottom: -100%; }
}

</style>
</head>
<body>

<div class="water-container">
    <div class="water"></div>
</div>

</body>
</html>
