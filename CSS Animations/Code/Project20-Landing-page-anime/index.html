<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Landing Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;

            animation: navFade 3s ease forwards;
            opacity: 0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            position: relative;
            text-decoration: none;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        /* Underline Animation */
        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 0%;
            height: 2px;
            background: #ff4b2b;
            transition: 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        @keyframes navFade {

            from{
                opacity: 0;
                transform: translateY(-200px);
            }
            to {
                opacity: 1;
                transform: translateY(0px);
            }
        }

        /* ================= HERO ================= */

        .hero {
            height: 100vh;
            position: relative;
            background: linear-gradient(90deg, #141e30, #243b55, #0f2027, #2c5364);
            animation: bgMove 10s ease infinite;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        /* ================= HERO CONTENT ================= */

        .content {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }

        .content h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease forwards;
        }

        .content p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease forwards;
            animation-delay: 0.5s;
        }

        .cta-btn {
            padding: 15px 40px;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            color: white;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            transition: 0.3s;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease forwards;
            animation-delay: 1s;
        }

        .cta-btn:hover {
            transform: scale(1.1);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================= BUBBLES ================= */

        .bubbles {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .circle {
            position: absolute;
            bottom: -120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            animation: bubbleMove linear infinite;
        }

        .circle:nth-child(odd) {
            width: 60px;
            height: 60px;
        }

        .circle:nth-child(even) {
            width: 100px;
            height: 100px;
        }

        .circle:nth-child(1) {
            left: 5%;
            animation-duration: 6s;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            left: 15%;
            animation-duration: 8s;
            animation-delay: 1s;
        }

        .circle:nth-child(3) {
            left: 25%;
            animation-duration: 7s;
            animation-delay: 3s;
        }

        .circle:nth-child(4) {
            left: 35%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .circle:nth-child(5) {
            left: 45%;
            animation-duration: 5s;
            animation-delay: 4s;
        }

        .circle:nth-child(6) {
            left: 55%;
            animation-duration: 6s;
            animation-delay: 1s;
        }

        .circle:nth-child(7) {
            left: 65%;
            animation-duration: 4s;
            animation-delay: 2s;
        }

        .circle:nth-child(8) {
            left: 75%;
            animation-duration: 6.5s;
            animation-delay: 3s;
        }

        .circle:nth-child(9) {
            left: 85%;
            animation-duration: 8.5s;
            animation-delay: 2s;
        }

        .circle:nth-child(10) {
            left: 95%;
            animation-duration: 6.5s;
            animation-delay: 1s;
        }

        @keyframes bubbleMove {
            0% {
                transform: translate(0, 0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            25% {
                transform: translate(25px, -25vh);
            }

            50% {
                transform: translate(-25px, -50vh);
            }

            75% {
                transform: translate(25px, -75vh);
            }

            100% {
                transform: translate(0, -110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">MyBrand</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <section class="hero">

        <div class="content">
            <h1>Build Modern Web Experiences</h1>
            <p>Create stunning animations and interactive designs using only HTML and CSS. Learn by building real
                projects.</p>
            <button class="cta-btn">Get Started</button>
        </div>

        <div class="bubbles">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>

    </section>

</body>

</html>
