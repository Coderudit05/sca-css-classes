<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Loading Dots</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }
        
        .container {
            background: white;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h2 {
            margin-bottom: 40px;
            color: #333;
        }
        
        .wave {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .dot {
            width: 25px;
            height: 25px;
            background: #3498db;
            border-radius: 50%;
            animation: wave 1.2s ease-in-out infinite;
        }
        
        .dot:nth-child(2) {
            animation-delay: 0.2s;
            background: #e74c3c;
        }
        
        .dot:nth-child(3) {
            animation-delay: 0.4s;
            background: #f1c40f;
        }
        
        .dot:nth-child(4) {
            animation-delay: 0.6s;
            background: #2ecc71;
        }
        
        .dot:nth-child(5) {
            animation-delay: 0.8s;
            background: #9b59b6;
        }
        
        @keyframes wave {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-30px);
            }
        }
        
        .message {
            color: #666;
            font-size: 18px;
            margin-top: 20px;
            animation: fade 2s infinite;
        }
        
        @keyframes fade {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Wave Loading Dots</h2>
        <div class="wave">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <p class="message">Loading your content...</p>
    </div>
</body>
</html>
