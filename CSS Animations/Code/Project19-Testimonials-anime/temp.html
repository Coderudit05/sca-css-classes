<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        .testimonial-section {
            height: 100vh;
            padding: 20px 40px;
            background-color: rgb(181, 217, 181);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .testimonials {
            background-color: violet;
            width: 90%;
            height: 350px;

            display: flex;
            align-items: center;
            overflow: hidden;
            /* overflow-x: auto; */

            position: relative;
            z-index: 1;
        }

        .testimonials::before{
            content: "";
            height: 100%;
            width: 100px;
            background: linear-gradient(to right,white,transparent);

            position: absolute;

            top: 0;
            left: 0;

        }
        .testimonials::after{
            content: "";
            height: 100%;
            width: 100px;
            background: linear-gradient(to right,transparent,white);

            position: absolute;

            top: 0;
            right: 0;
        }

        .slider {
            background-color: red;

            display: flex;
            gap: 20px;
            z-index: -1;           

            animation: slider-anime 10s linear infinite;
        }

        .slider:hover{
            animation-play-state: paused;
        }

        @keyframes slider-anime {
            0%{
                transform: translateX(0);
            }
            100%{
                transform: translateX(-50%);
                
            }
        }



        .testimonial {
            height: 300px;
            width: 300px;
            background-color: yellowgreen;
        }
    </style>
</head>

<body>

    <section class="testimonial-section">
        <div class="testimonials">
            <div class="slider">
                <div class="testimonial"></div>
                <div class="testimonial"></div>
                <div class="testimonial"></div>
                <div class="testimonial"></div>
                <div class="testimonial"></div>
                <div class="testimonial"></div>
                <div class="testimonial"></div>
                <div class="testimonial"></div>
               
            </div>
        </div>
    </section>
</body>

</html>
