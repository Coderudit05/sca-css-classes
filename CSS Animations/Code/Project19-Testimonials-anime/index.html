<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f2027;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .testimonial-section {
            width: 80%;
            overflow: hidden;
            border: 2px solid #00f2ff;
            padding: 20px 0;
        }

        .testimonial-track {
            display: flex;
            gap: 40px;
            animation: scroll 15s linear infinite;
        }

        .testimonial {
            min-width: 250px;
            padding: 20px;
            background: linear-gradient(135deg, #00f2ff, #4facfe);
            color: black;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
        }

        @keyframes scroll {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }
    </style>
</head>

<body>

    <div class="testimonial-section">
        <div class="testimonial-track">
            <div class="testimonial">Amazing teaching style! ⭐⭐⭐⭐⭐</div>
            <div class="testimonial">Very easy to understand concepts.</div>
            <div class="testimonial">Best CSS animations class ever!</div>
            <div class="testimonial">Loved the practical sessions.</div>

            <div class="testimonial">Amazing teaching style! ⭐⭐⭐⭐⭐</div>
            <div class="testimonial">Very easy to understand concepts.</div>
            <div class="testimonial">Best CSS animations class ever!</div>
            <div class="testimonial">Loved the practical sessions.</div>
        </div>
    </div>

</body>

</html>
