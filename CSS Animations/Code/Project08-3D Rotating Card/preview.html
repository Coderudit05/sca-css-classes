<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rotating Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: Arial, sans-serif;
        }
        
        .container {
            text-align: center;
        }
        
        h2 {
            color: white;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .card-container {
            width: 300px;
            height: 400px;
            perspective: 1500px;
            cursor: pointer;
        }
        
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 6s infinite linear;
            transition: transform 0.5s;
        }
        
        .card:hover {
            animation-play-state: paused;
        }
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            padding: 20px;
        }
        
        .card-front {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            transform: rotateY(0deg);
        }
        
        .card-front h3 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        
        .card-front p {
            font-size: 18px;
            text-align: center;
        }
        
        .card-back {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            transform: rotateY(180deg);
        }
        
        .card-back h3 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        
        .card-back ul {
            list-style: none;
        }
        
        .card-back li {
            margin: 10px 0;
            font-size: 16px;
        }
        
        @keyframes rotate {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        
        .info {
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>3D Rotating Card</h2>
        <div class="card-container">
            <div class="card">
                <div class="card-front">
                    <h3>Front Side</h3>
                    <p>Hover to pause rotation!</p>
                    <p style="margin-top: 20px; font-size: 14px;">✨ Click to inspect in 3D ✨</p>
                </div>
                <div class="card-back">
                    <h3>Back Side</h3>
                    <ul>
                        <li>✓ CSS 3D Transforms</li>
                        <li>✓ Preserve-3D</li>
                        <li>✓ Backface Visibility</li>
                        <li>✓ Perspective</li>
                    </ul>
                </div>
            </div>
        </div>
        <p class="info">Hover to stop rotation • Inspect with DevTools</p>
    </div>
</body>
</html>
