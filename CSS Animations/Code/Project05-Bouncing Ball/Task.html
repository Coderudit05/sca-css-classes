<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        .main {
            height: 100%;
            width: 100%;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);

            display: flex;
            align-items: center;
            justify-content: center;

        }

        .card {
            height: 350px;
            width: 350px;
            background-color: white;
            border-radius: 10px;

            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .ball {
            height: 100px;
            width: 100px;
            background: radial-gradient(circle at 30% 30%,
                    #ffffff 0%,
                    #ffd6d6 10%,
                    #ff9a9a 20%,
                    #ff5c5c 35%,
                    #e63946 50%,
                    #c1121f 65%,
                    #9d0208 75%,
                    #6a040f 85%,
                    #370617 95%,
                    #1b0000 100%);

            border-radius: 50%;
            margin: 0px auto;
            margin-top: 120px;


            /* From here we are going to start the animation part we need to transform the ball in the -y direction */

            /* We need to define the animation name */
            animation-name: ball-anime;

            /* Now we need to define the duration like for how much time the animation will be ongoing */
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-out;
        }

        .shadow {
            width: 100px;
            height: 30px;
            background-color: gray;
            margin: 10px auto;
            border-radius: 50%;

            animation-name: shadow-anime;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;


        }


        @keyframes ball-anime {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-200px);

            }

            100% {
                transform: translateY(0);

            }

        }


        @keyframes shadow-anime {
            0% {
                transform: scale(1);
            }

            50% {

                transform: scale(0.2);
            }

            100% {

                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="main">
        <div class="card">
            <h1>Bouncing Ball</h1>
            <div class="ball"></div>
            <div class="shadow"></div>
        </div>
    </div>

</body>

</html>
