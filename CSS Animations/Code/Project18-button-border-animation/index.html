<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Modern gradient background */
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(57, 44, 44);
        }

        /* Button Styling */
        .animated-btn {
            position: relative;
            padding: 15px 50px;
            font-size: 18px;
            color: white;
            background: #0f2027;
            border: none;
            cursor: pointer;
            overflow: hidden;
            letter-spacing: 1px;
            border-radius: 5px;
        }

        /* Common border styling */
        .animated-btn .top,
        .animated-btn .bottom {
            position: absolute;
            background: linear-gradient(90deg,
                    transparent,
                    #ff00cc,
                    #3333ff,
                    #00f2ff,
                    #ff00cc,
                    transparent);
        }

        .animated-btn .left,
        .animated-btn .right {
            position: absolute;
            background: linear-gradient(to bottom,
                    transparent,
                    #ff00cc,
                    #3333ff,
                    #00f2ff,
                    #ff00cc,
                    transparent);
        }

        /* Top Border */
        .top {
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            animation: topFlow 2s linear infinite;
        }

        @keyframes topFlow {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(200%);
            }
        }

        /* Bottom Border */
        .bottom {
            bottom: 0;
            right: -100%;
            width: 100%;
            height: 3px;
            animation: bottomFlow 2s linear infinite;
        }

        @keyframes bottomFlow {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-200%);
            }
        }

        /* Left Border */
        .left {
            left: 0;
            bottom: -100%;
            width: 3px;
            height: 100%;
            animation: leftFlow 2s linear infinite;
        }

        @keyframes leftFlow {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-200%);
            }
        }

        /* Right Border */
        .right {
            right: 0;
            top: -100%;
            width: 3px;
            height: 100%;
            animation: rightFlow 2s linear infinite;
        }

        @keyframes rightFlow {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(200%);
            }
        }
    </style>
</head>

<body>

    <button class="animated-btn">
        Click Me
        <span class="top"></span>
        <span class="bottom"></span>
        <span class="left"></span>
        <span class="right"></span>
    </button>

</body>

</html>
