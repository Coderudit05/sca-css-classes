<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .box {
            position: relative;
            width: 300px;
            height: 200px;
        }

        .box span {
            position: absolute;
            background: #00f2ff;
        }

        /* Top */
        .top {
            top: 0;
            left: 0;
            height: 4px;
            width: 0;
            animation: topMove 2s linear infinite;
        }

        @keyframes topMove {
            0% {
                width: 0;
            }

            50% {
                width: 100%;
            }

            100% {
                width: 0;
            }
        }

        /* Bottom */
        .bottom {
            bottom: 0;
            right: 0;
            height: 4px;
            width: 0;
            animation: bottomMove 2s linear infinite;
        }

        @keyframes bottomMove {
            0% {
                width: 0;
            }

            50% {
                width: 100%;
            }

            100% {
                width: 0;
            }
        }

        /* Left */
        .left {
            left: 0;
            bottom: 0;
            width: 4px;
            height: 0;
            animation: leftMove 2s linear infinite;
        }

        @keyframes leftMove {
            0% {
                height: 0;
            }

            50% {
                height: 100%;
            }

            100% {
                height: 0;
            }
        }

        /* Right */
        .right {
            right: 0;
            top: 0;
            width: 4px;
            height: 0;
            animation: rightMove 2s linear infinite;
        }

        @keyframes rightMove {
            0% {
                height: 0;
            }

            50% {
                height: 100%;
            }

            100% {
                height: 0;
            }
        }
    </style>
</head>

<body>

    <div class="box">
        <span class="top"></span>
        <span class="bottom"></span>
        <span class="left"></span>
        <span class="right"></span>
    </div>

</body>

</html>
