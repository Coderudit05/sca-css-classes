<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        .main {
            height: 100%;
            width: 100%;
            background-color: rgb(178, 140, 140);
            position: relative;
        }

        .box {
            height: 150px;
            width: 150px;
            background-color: blueviolet;

            position: absolute;

            animation-name: box-anime;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;

        }

        /*
        @keyframes box-anime {

            0% {


                transform: translate(0, 0);
            }

            25% {
                transform: translate(1350px, 0);

            }

            50% {

                transform: translate(1350px, 500px);

            }

            75% {
                transform: translate(0px, 500px);

            }

            100% {

                transform: translate(0px, 0px);
            }
        }
       */

        @keyframes box-anime {
            0% {
                top: 0;
                left: 0;
            }

            25% {
                top: 0;
                left: 1380px;
            }

            50% {
                top: 540px;
                left: 1380px;
            }

            75% {
                left: 0;
                top: 540px;
            }

            100% {
                left: 0;
                top: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main">
        <div class="box"></div>
    </div>

</body>

</html>
