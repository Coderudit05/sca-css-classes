<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        .main {
            height: 100%;
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);

            display: flex;
            align-items: center;
            justify-content: center;

        }

        .card {
            height: 300px;
            width: 400px;
            background-color: white;
            border-radius: 20px;
            padding: 20px;
        }

        .card h1 {
            text-align: center;
        }

        .status {
            width: 90%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* padding: 10px 15px; */
            margin: 20px auto;
        }

        .progress-container {
            height: 30px;
            width: 90%;
            background-color: white;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin: 20px auto;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: greenyellow;

            animation-name: progress-bar-anime;
            animation-duration: 8s;
        }

        @keyframes progress-bar-anime {
            0% {
                width: 0%;
            }

            20% {
                width: 20%;

            }

            40% {
                width: 40%;

            }

            60% {
                width: 60%;

            }

            80% {
                width: 80%;

            }

            100% {
                width: 100%;

            }
        }

        .card .button-box {

            /* background-color: yellow; */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card a {
            background-color: #764ba2;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            margin: 20px auto;
            cursor: pointer;
            border-radius: 20px;
            font-size: 20px;

            transition: all 0.3s;
        }

        .card a:hover {
            background-color: rebeccapurple;
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <div class="main">
        <div class="card">
            <h1>Progress Bar Animation</h1>

            <div class="status">
                <p>Loading Resources</p>
                <p>100%</p>
            </div>

            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>

            <div class="button-box">
                <a href="">Replay Animation</a>
            </div>

        </div>
    </div>

</body>

</html>
