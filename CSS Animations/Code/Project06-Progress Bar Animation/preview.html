<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }

        .container {
            width: 500px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
            text-align: center;
        }

        .info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
        }

        .progress-container {
            background-color: whitesmoke;
            height: 30px;
            border-radius: 20px;
            margin: 10px auto;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: greenyellow;

            animation: progress-bar-anime 10s ease-in-out;
        }

        @keyframes progress-bar-anime {
            0% {
                width: 0%;
            }

            20% {
                width: 20%;

            }

            20% {
                width: 40%;

            }

            40% {
                width: 60%;

            }

            60% {
                width: 80%;

            }

            80% {
                width: 90%;

            }

            100% {
                width: 100%;

            }
        }

        .bottom {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        a {
            text-decoration: none;
            background-color: #667eea;
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            margin-top: 20px;

            transition: transform linear 0.3s;
        }

        a:hover {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Progress Bar Animation</h1>
        <div class="info">
            <p>Loading Resources</p>
            <p>100%</p>
        </div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="bottom">
            <a href="">Replay Animation</a>
        </div>
    </div>

</body>

</html>
