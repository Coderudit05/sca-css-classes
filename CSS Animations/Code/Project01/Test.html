<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        .main {
            height: 100%;
            width: 100%;
            background-color: rgb(205, 178, 178);

            display: flex;
            justify-content: center;
            align-items: center;

        }

        .card {
            height: 200px;
            width: 200px;
            border: 2px solid black;

            animation-name: box-color-anime;
            animation-duration: 10s;
            /* animation-delay: 2s; */
            animation-iteration-count: 2;
            animation-timing-function: ease ;
            animation-timing-function: ease-in ;
            animation-timing-function: ease-in-out ;
            animation-timing-function: linear;
        }

        /* this is my first approach to do this using from and to  */

        /* 
           @keyframes box-color-anime {

            from {
                background-color: aqua;
            }

            to {
                background-color: brown;
            }
        }

        */
        /* I can create the same animation using the % as well I need to define the 0% to 100% and then I can achieve the animation */


        @keyframes box-color-anime {
            0% {
                background-color: aqua;
            }

            20% {
                background-color: red;

            }

            40% {
                background-color: rebeccapurple;

            }

            60% {
                background-color: crimson;

            }

            80% {
                background-color: greenyellow;

            }

            100% {
                background-color: pink;

            }
        }
    </style>
</head>

<body>

    <div class="main">
        <div class="card"></div>
    </div>

</body>

</html>
