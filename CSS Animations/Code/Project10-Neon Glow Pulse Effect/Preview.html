<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Text Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            font-family: 'Courier New', monospace;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            text-align: center;
            max-width: 600px;
        }

        h2 {
            margin-bottom: 30px;
            color: #333;
            font-family: Arial, sans-serif;
        }

        /* Single Line Typing */
        .typing-text {
            display: inline-block;
            font-size: 28px;
            color: #2c3e50;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #3498db;
            width: 0;
            animation: 
                typing 3s steps(22) forwards,
                blink 0.6s step-end infinite;
        }

        @keyframes typing {
            to { width: 22ch; }
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        /* Multi-line Code Block */
        .code-block {
            text-align: left;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            margin: 30px 0;
        }

        .code-line {
            white-space: nowrap;
            overflow: hidden;
            font-size: 18px;
            color: #9cdcfe;
            width: 0;
            border-right: 2px solid #569cd6;
        }

        .code-line:nth-child(1) {
            animation: typeLine 1.5s steps(20) forwards,
                       cursorHide 0s 1.5s forwards;
        }

        .code-line:nth-child(2) {
            color: #ce9178;
            padding-left: 2ch;
            animation: typeLine 1.5s steps(18) 1.5s forwards,
                       cursorHide 0s 3s forwards;
        }

        .code-line:nth-child(3) {
            animation: typeLine 0.5s steps(1) 3s forwards,
                       blink 0.6s step-end 3s infinite;
        }

        @keyframes typeLine {
            to { width: 100%; }
        }

        @keyframes cursorHide {
            to { border-color: transparent; }
        }

        .features {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .feature {
            padding: 6px 14px;
            background: #e8f4fc;
            border-radius: 15px;
            font-size: 12px;
            color: #3498db;
        }

        .note {
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Typing Text Effect</h2>

        <div class="typing-text">Hello, I'm learning CSS!</div>

        <div class="code-block">
            <div class="code-line">function learnCSS() {</div>
            <div class="code-line">return "Amazing!";</div>
            <div class="code-line">}</div>
        </div>

        <div class="features">
            <span class="feature">steps() timing</span>
            <span class="feature">Blinking cursor</span>
            <span class="feature">Sequential lines</span>
        </div>

        <p class="note">Text appears character by character</p>
    </div>
</body>
</html>
