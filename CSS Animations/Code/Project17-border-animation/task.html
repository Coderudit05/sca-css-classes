<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        .main {
            height: 100%;
            background-color: #111;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            height: 200px;
            width: 300px;
            background-color: white;

            position: relative;

        }

        .box span {
            background-color: blue;
        }

        .top,
        .bottom {
            position: absolute;
            width: 100%;
            height: 5px;
            background-color: blueviolet;
        }

        .top {

            top: 0;
            left: 0;

        }

        @keyframes top-anime {
            0% {
                width: 0;
            }

            50% {
                width: 100%;

            }

            100% {
                width: 0;

            }
        }

        .bottom {
            bottom: 0;
            left: 0;
        }

        @keyframes bottom-anime {
            0% {
                width: 0;
            }

            50% {
                width: 100%;

            }

            100% {
                width: 0;

            }
        }

        .left,
        .right {
            position: absolute;
            height: 100%;
            width: 5px;
            background-color: blueviolet;
        }

        .left {
            top: 0;
            left: 0;
        }

        @keyframes left-anime {
            0% {}

            50% {}

            100% {}
        }

        .right {
            top: 0;
            right: 0;
        }

        @keyframes right-anime {
            0% {}

            50% {}

            100% {}
        }
    </style>
</head>

<body>

    <div class="main">
        <div class="box">

            <span class="top"></span>
            <span class="bottom"></span>
            <span class="left"></span>
            <span class="right"></span>
        </div>
    </div>

</body>

</html>
