<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .box {
            position: relative;
            width: 300px;
            height: 200px;
            overflow: hidden;
        }

        .box span {
            position: absolute;
            background: #00f2ff;
        }

        /* Top */
        .top {
            top: 0;
            left: -100%;
            width: 100%;
            height: 4px;
            animation: topFlow 2s linear infinite;
        }

        @keyframes topFlow {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(200%);
            }
        }

        /* Bottom */
        .bottom {
            bottom: 0;
            right: -100%;
            width: 100%;
            height: 4px;
            animation: bottomFlow 2s linear infinite;
        }

        @keyframes bottomFlow {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-200%);
            }
        }

        /* Left */
        .left {
            left: 0;
            bottom: -100%;
            width: 4px;
            height: 100%;
            animation: leftFlow 2s linear infinite;
        }

        @keyframes leftFlow {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-200%);
            }
        }

        /* Right */
        .right {
            right: 0;
            top: -100%;
            width: 4px;
            height: 100%;
            animation: rightFlow 2s linear infinite;
        }

        @keyframes rightFlow {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(200%);
            }
        }
    </style>
</head>

<body>

    <div class="box">
        <span class="top"></span>
        <span class="bottom"></span>
        <span class="left"></span>
        <span class="right"></span>
    </div>

</body>

</html>
