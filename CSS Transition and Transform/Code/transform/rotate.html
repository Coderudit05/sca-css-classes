<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            padding: 20px ;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .box {
            height: 300px;
            width: 300px;
            background-color: blueviolet;

            display: flex;
            align-items: center;
            justify-content: center;

            transform: rotate(180deg);
            color: white;
            font-size: 30px;
        }

    </style>
</head>

<body>

    <div class="box">Hello I am box </div>

</body>

</html>
