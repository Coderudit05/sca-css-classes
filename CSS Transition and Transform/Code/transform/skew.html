<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            padding: 20px ;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .box {
            height: 300px;
            width: 300px;
            background-color: blueviolet;   

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 40px;     
            
            
            /* transform: skew(20deg); */
            transform: skew(20deg,20deg);
        }

    </style>
</head>

<body>

    <div class="box">
        hello i am box
    </div>

</body>

</html>
