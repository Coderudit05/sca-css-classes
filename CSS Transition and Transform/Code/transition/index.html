<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            padding: 20px ;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .box {
            height: 200px;
            width: 200px;
            background-color: blueviolet;  

            transition-property: width;
            transition-duration: 2s;

            /* transition: width 2s; */
        }

        .box:hover{
            width: 500px;
        }

    </style>
</head>

<body>

    <div class="box">

    </div>

</body>

</html>
