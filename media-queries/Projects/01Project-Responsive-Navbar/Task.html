<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://kit.fontawesome.com/f12c1313f0.js" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 20px 40px;

            background-color: black;

            color: white;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;

            font-size: 20px;
        }

        .nav-btns button {
            font-size: 16px;
            padding: 10px 20px;
            border-radius: 5px;

            cursor: pointer;
        }

        .nav-btns button:nth-child(1) {
            background-color: indianred;
            color: white;
        }

        nav .menu-icon{
            display: none;
        }



        /* From here we are going to write the code for the responsive navbar using media queries */

        @media (max-width:750px) {

            nav ul {
                display: none;
            }

            .nav-btns {
                display: none;
            }

            nav .menu-icon{
                display: block;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h1>Logo</h1>

        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Service</li>
            <li>Contact</li>
        </ul>

        <div class="nav-btns">
            <button>Log in</button>
            <button>Sign Up</button>
        </div>

        <i class="fa-solid fa-bars menu-icon"></i>
    </nav>


</body>

</html>
